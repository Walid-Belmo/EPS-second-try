# openocd.cfg - default CMSIS-DAP connection config for SAMD21 boards.
#
# Works with CMSIS-DAP probes such as Curiosity Nano nEDBG, Atmel-ICE,
# DAPLink, and PICkit/SNAP only after they have been switched to CMSIS-DAP
# firmware. The target script supports both SAMD21G17D and SAMD21J17D.

adapter driver cmsis-dap
transport select swd
source [find target/at91samdXX.cfg]
adapter speed 1000
