# OpenOCD config for flashing the SAMD21 mainboard with an ST-Link probe.
#
# The target board must be powered separately and the ST-Link VTREF/VCC-sense
# pin must see the board's 3.3 V rail.

source [find interface/stlink.cfg]
transport select swd
source [find target/at91samdXX.cfg]
adapter speed 1000
